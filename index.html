<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>CG跨境直播 · 主播专属主页</title>
<style>
  :root{ --purple:#7C4DFF; --purple-d:#5E35B1; --purple-l:#E2D8FF; --bg:#F7F5FD; --ink:#2E204E; --sub:#9684C4; --line:#ECE7F7; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
  .topbar{background:var(--purple);color:#fff;text-align:center;padding:22px 16px 18px;}
  .topbar h1{margin:0;font-size:22px;letter-spacing:1px;}
  .topbar p{margin:6px 0 0;font-size:13px;color:var(--purple-l);}
  .wrap{max-width:460px;margin:0 auto;padding:20px 18px 40px;}
  .enroll-banner{display:block;background:var(--purple-d);color:#fff;text-decoration:none;text-align:center;font-weight:700;padding:14px;border-radius:12px;font-size:14.5px;margin-bottom:18px;line-height:1.4;}
  .search{display:flex;gap:10px;margin-top:8px;}
  .search input{flex:1;border:2px solid var(--purple);border-radius:12px;padding:13px 14px;font-size:16px;outline:none;background:#fff;color:var(--ink);}
  .search button{background:var(--purple);color:#fff;border:none;border-radius:12px;padding:0 20px;font-size:16px;font-weight:700;}
  .hint{color:var(--sub);font-size:12.5px;margin:10px 2px 0;line-height:1.5;}
  .result{margin-top:18px;}
  .save-banner{background:var(--purple-d);color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5;text-align:center;font-weight:600;}
  .card-img{width:100%;border-radius:16px;margin-top:14px;display:block;box-shadow:0 8px 24px rgba(94,53,177,.18);background:#fff;}
  .btn-links{display:flex;gap:10px;margin-top:12px;}
  .btn-links a{flex:1;text-align:center;padding:12px;border-radius:12px;font-size:14px;font-weight:700;text-decoration:none;color:#fff;}
  .btn-return{background:var(--purple);}
  .btn-dk{background:var(--purple-d);}
  .info-card{background:#fff;border:1px solid var(--line);border-radius:14px;margin-top:16px;padding:6px 16px;}
  .info-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px;}
  .info-row:last-child{border-bottom:none;}
  .info-row span{color:var(--sub);}
  .info-row b{color:var(--ink);font-weight:700;}
  .sec-title{margin:22px 2px 10px;font-size:15px;font-weight:700;color:var(--purple-d);display:flex;align-items:center;gap:8px;}
  .sec-title::before{content:"";width:4px;height:15px;background:var(--purple);border-radius:2px;display:inline-block;}
  .order{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;}
  .order-h{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:8px;}
  .order-h .disc{color:var(--purple-d);}
  .order-line{font-size:13.5px;color:#5b4b86;line-height:1.7;}
  .order-line b{color:var(--sub);font-weight:600;margin-right:4px;}
  .order-photo{width:100%;border-radius:10px;margin-top:10px;display:block;background:#f0ecfa;}
  .order-link{display:inline-block;margin-top:10px;background:var(--purple-l);color:var(--purple-d);text-decoration:none;font-weight:700;padding:8px 14px;border-radius:10px;font-size:13.5px;}
  .empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--sub);font-size:14px;}
  .notfound{margin-top:18px;background:#fff;border-radius:14px;padding:18px;text-align:center;color:var(--ink);font-size:14px;line-height:1.6;border:1px solid var(--line);}
  .notfound a{color:var(--purple-d);font-weight:700;}
  .enroll-inline{display:inline-block;margin-top:14px;background:var(--purple);color:#fff;text-decoration:none;font-weight:700;padding:12px 20px;border-radius:10px;font-size:14px;}
  .foot{text-align:center;color:var(--sub);font-size:12px;margin-top:30px;}
  .hidden{display:none;}
  .status{margin-top:14px;font-size:12.5px;color:var(--sub);text-align:center;}
  .status a{color:var(--purple-d);font-weight:700;text-decoration:none;}
</style>
</head>
<body>
  <div class="topbar">
    <h1>CG跨境直播</h1>
    <p>主播专属主页 · 一码对接</p>
  </div>
  <div class="wrap">
    <a class="enroll-banner" href="https://pan.yyfafa.com/enroll.html">＋ 新主播 / 首次对接？点此登记入驻，领取专属码</a>
    <div class="search">
      <input id="q" type="text" inputmode="text" autocomplete="off" placeholder="输入微信号 / 主播码 / 手机号" />
      <button id="go">查看</button>
    </div>
    <p class="hint">已入驻的主播：输入您的<b>主播码</b>、填写资料时的<b>微信号</b>或预留<b>手机号</b>，即可查看您的一码通及关联进货单。新主播请先点上方登记。</p>
    <div id="status" class="status hidden"></div>
    <div id="result" class="result hidden"></div>
    <p class="foot">CG跨境直播中台 · 一码一人</p>
  </div>
<script>
var DATA = {"enroll_form_url": "https://doc.weixin.qq.com/smartsheet/form/1_wpuhKyBwAAcmbbqssZ_-93rtRz4i-HJw_5572c9", "streamers": [{"code": "CG-PAN-001", "name": "小鹿", "wechat": "xiaolu_wx_demo", "phone": "13800000001", "platform": "TikTok", "card": "cards/CG-PAN-001.png", "orders": [{"date": "2026-08-19", "discount": "32%", "method": "", "note": "示例·档口回传演示", "attachment": null, "photo": null}]}, {"code": "CG-PAN-002", "name": "阿May", "wechat": "", "phone": "", "platform": "TikTok", "card": "cards/CG-PAN-002.png", "orders": []}, {"code": "CG-PAN-003", "name": "莉莉", "wechat": "", "phone": "", "platform": "小红书", "card": "cards/CG-PAN-003.png", "orders": []}, {"code": "CG-PAN-004", "name": "Coco", "wechat": "", "phone": "", "platform": "抖音", "card": "cards/CG-PAN-004.png", "orders": []}, {"code": "CG-PAN-005", "name": "娜娜", "wechat": "", "phone": "", "platform": "TikTok", "card": "cards/CG-PAN-005.png", "orders": []}, {"code": "CG-PAN-006", "name": "潘潘", "wechat": "Pyyake", "phone": "13757133019", "platform": "TikTok", "card": "cards/CG-PAN-006.png", "orders": []}, {"code": "CG-PAN-007", "name": "Kayla", "wechat": "18021337956", "phone": "18021337956", "platform": "其他", "card": "cards/CG-PAN-007.png", "orders": []}, {"code": "CG-PAN-008", "name": "Fernndoexportaxor", "wechat": "15021472034", "phone": "15021472034", "platform": "TikTok", "card": "cards/CG-PAN-008.png", "orders": []}, {"code": "CG-PAN-009", "name": "66", "wechat": "u d n n c y", "phone": "13958818821", "platform": "小红书", "card": "cards/CG-PAN-009.png", "orders": []}, {"code": "CG-PAN-010", "name": "Kayla", "wechat": "18021337956", "phone": "18021337856", "platform": "其他", "card": "cards/CG-PAN-010.png", "orders": []}]};
var RETURN_URL = "https://pan.yyfafa.com/boss.html?v=2&role=streamer&code=";
var DK_URL = "https://pan.yyfafa.com/boss.html?v=2&code=";

// 合并本地新主播(入驻表单前端生成的,自动入搜索索引)
try {
  var localNews = JSON.parse(localStorage.getItem("cg_new_streamers") || "[]");
  if (localNews.length) DATA.streamers = DATA.streamers.concat(localNews);
} catch(e){ console.warn("merge new fail", e); }

// 实时拉飞书主播码台账 + 回传表，合并进检索索引（保证新入驻主播立即可查）
async function loadLive(force){
  var st = document.getElementById("status");
  try {
    if(!force) show("status");
    st.innerHTML = "正在同步主播数据…";
    var r = await fetch("https://api.yyfafa.com/api/streamers?_=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    var data = await r.json();
    if (!data || !data.ok || !data.streamers) throw new Error("返回数据异常");
    var byCode = {};
    DATA.streamers.forEach(function(s){ byCode[s.code] = s; });
    data.streamers.forEach(function(s){
      var ex = byCode[s.code];
      if (ex) {
        // 实时字段优先；保留静态卡片图，实时有订单则覆盖
        ex.name = s.name || ex.name;
        ex.wechat = s.wechat || ex.wechat;
        ex.phone = s.phone || ex.phone;
        ex.platform = s.platform || ex.platform;
        ex.status = s.status || ex.status;
        if (s.orders && s.orders.length) ex.orders = s.orders;
      } else {
        DATA.streamers.push(s);
        byCode[s.code] = s;
      }
    });
    st.innerHTML = "主播数据已同步（" + DATA.streamers.length + "人） · <a href=\"#\" onclick=\"loadLive(true);return false;\">刷新</a>";
  } catch(e){
    console.warn("live load fail", e);
    st.innerHTML = "实时数据同步失败：" + (e.message || "网络异常") + " · <a href=\"#\" onclick=\"loadLive(true);return false;\">重试</a>";
  }
}

function normalize(s){ return String(s||"").trim().toLowerCase().replace(/[\s\-]/g, ""); }
function esc(s){ return String(s||"").replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

function fileUrl(u){ return u ? "https://api.yyfafa.com/api/file?u=" + encodeURIComponent(u) : ""; }
function orderHtml(o){
  var h = '<div class="order-h">直播日期 ' + esc(o.date||"-") + '　<span class="disc">折扣 ' + esc(o.discount||"-") + '</span></div>';
  if(o.method) h += '<div class="order-line"><b>回传方式</b>' + esc(o.method) + '</div>';
  if(o.country) h += '<div class="order-line"><b>直播国家</b>' + esc(o.country) + '</div>';
  if(o.note)   h += '<div class="order-line"><b>备注</b>' + esc(o.note) + '</div>';
  if(o.attachment) h += '<a class="order-link" href="' + esc(fileUrl(o.attachment)) + '" target="_blank" rel="noopener">查看配货单</a>';
  if(o.photo) h += '<img class="order-photo" src="' + esc(fileUrl(o.photo)) + '" alt="开单照片" />';
  if(o.tk) h += '<img class="order-photo" src="' + esc(fileUrl(o.tk)) + '" alt="TK数据大屏" />';
  if(o.online) h += '<img class="order-photo" src="' + esc(fileUrl(o.online)) + '" alt="在线场关" />';
  if(o.scene) h += '<img class="order-photo" src="' + esc(fileUrl(o.scene)) + '" alt="现场照" />';
  return '<div class="order">' + h + '</div>';
}

async function search(){
  await loadLive(); // 每次检索前实时刷新，保证新入驻主播立即可查
  var raw = document.getElementById("q").value;
  var key = normalize(raw);
  var box = document.getElementById("result");
  if(!key){ box.classList.add("hidden"); return; }

  var hit = DATA.streamers.find(function(s){
    return normalize(s.code)===key || (s.wechat && normalize(s.wechat)===key) || (s.phone && normalize(s.phone)===key);
  });

  if(hit){
    // 老主播用专属卡片,新主播(无 card 字段)用通用合并卡(enroll-card)兜底
    var cardSrc = hit.card || "cards/enroll-card.png";
    var cardImg = '<img class="card-img" src="' + esc(cardSrc) + '" alt="专属码卡" onerror="this.onerror=null;this.src=\'cards/enroll-card.png\'" />';
    var html = '<div class="save-banner">这是您的专属一码通 · 长按卡片图保存 / 点下方按钮回传</div>';
    html += cardImg;
    html += '<div class="btn-links">' +
      '<a class="btn-return" href="' + RETURN_URL + esc(hit.code) + '" target="_blank" rel="noopener">主播回传</a>' +
      '<a class="btn-dk" href="' + DK_URL + esc(hit.code) + '" target="_blank" rel="noopener">商家回传</a>' +
      '</div>';
    html += '<div class="info-card">' +
      '<div class="info-row"><span>主播码</span><b>' + esc(hit.code) + '</b></div>' +
      '<div class="info-row"><span>昵称</span><b>' + esc(hit.name||"-") + '</b></div>' +
      '<div class="info-row"><span>平台</span><b>' + esc(hit.platform||"-") + '</b></div>' +
      '<div class="info-row"><span>手机号</span><b>' + esc(hit.phone||"-") + '</b></div>' +
      '</div>';
    html += '<div class="sec-title">关联进货单（' + (hit.orders?hit.orders.length:0) + '）</div>';
    if(hit.orders && hit.orders.length){
      html += hit.orders.map(orderHtml).join("");
    } else {
      html += '<div class="empty">暂无关联进货单<br/>档口商家回传后将自动显示在这里</div>';
    }
    box.innerHTML = html;
  } else {
    box.innerHTML = '<div class="notfound">' +
      '未找到「' + esc(raw) + '」对应的主播码。<br/><br/>' +
      '若您是<b>首次对接的新主播</b>，请先登记入驻领取专属码：<br/>' +
      '<a class="enroll-inline" href="https://pan.yyfafa.com/enroll.html" target="_blank" rel="noopener">＋ 去登记入驻</a>' +
      '<br/><br/><span style="font-size:12.5px;color:#9684C4;">若您已入驻仍查不到，请确认输入的主播码 / 微信号 / 手机号是否正确，或联系对接人。</span>' +
      '</div>';
  }
  box.classList.remove("hidden");
}

document.getElementById("go").addEventListener("click", search);
document.getElementById("q").addEventListener("keydown", function(e){ if(e.key==="Enter") search(); });

// URL ?code= 或 ?q= 直接查询(支持入驻后跳转带手机号自动搜索)
(function(){
  var p = new URLSearchParams(location.search);
  var q = p.get("q") || p.get("code");
  if(q){ document.getElementById("q").value = q; search(); }
  else { loadLive(); }
})();
</script>
</body>
</html>
