<style>

  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;

  .topbar{background:var(--purple);color:#fff;text-align:center;padding:22px 16px 18px;}

  .topbar p{margin:6px 0 0;font-size:13px;color:var(--purple-l);}
  .wrap{max-width:460px;margin:0 auto;padding:20px 18px 40px;}
  .enroll-banner{display:block;background:var(--purple-d);color:#fff;text-decoration:none;

  .card-img{width:100%;border-radius:16px;margin-top:14px;display:block;
    box-shadow:0 8px 24px rgba(94,53,177,.18);background:#fff;}
  .qr{width:170px;height:170px;margin:14px auto 4px;background:#f0ecfa;border-radius:12px;display:block;}
  .dl{display:block;text-align:center;margin:14px auto 0;background:var(--purple);
    color:#fff;text-decoration:none;font-weight:700;padding:13px;border-radius:12px;font-size:15px;}
  .info-card{background:#fff;border:1px solid var(--line);border-radius:14px;
    margin-top:16px;padding:6px 16px;}
  .info-row{display:flex;justify-content:space-between;align-items:center;
    padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px;}
  .info-row:last-child{border-bottom:none;}
  .info-row span{color:var(--sub);}
  .info-row b{color:var(--ink);font-weight:700;}
  .sec-title{margin:22px 2px 10px;font-size:15px;font-weight:700;color:var(--purple-d);
    display:flex;align-items:center;gap:8px;}
  .sec-title::before{content:"";width:4px;height:15px;background:var(--purple);border-radius:2px;display:inline-block;}
  .order{background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;margin-bottom:12px;}
  .order-h{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:8px;}
  .order-h .disc{color:var(--purple-d);}
  .order-line{font-size:13.5px;color:#5b4b86;line-height:1.7;}
  .order-line b{color:var(--sub);font-weight:600;margin-right:4px;}
  .order-photo{width:100%;border-radius:10px;margin-top:10px;display:block;background:#f0ecfa;}
  .order-link{display:inline-block;margin-top:10px;background:var(--purple-l);color:var(--purple-d);
    text-decoration:none;font-weight:700;padding:8px 14px;border-radius:10px;font-size:13.5px;}
  .empty{background:#fff;border:1px dashed var(--line);border-radius:14px;
    padding:18px;text-align:center;color:var(--sub);font-size:14px;}
  .notfound{margin-top:18px;background:#fff;border-radius:14px;padding:18px;
    text-align:center;color:var(--ink);font-size:14px;line-height:1.6;border:1px solid var(--line);}
  .notfound a{color:var(--purple-d);font-weight:700;}
  .enroll-inline{display:inline-block;margin-top:14px;background:var(--purple);color:#fff;
    text-decoration:none;font-weight:700;padding:12px 20px;border-radius:10px;font-size:14px;}
  .foot{text-align:center;color:var(--sub);font-size:12px;margin-top:30px;}
  .hidden{display:none;}

function normalize(s){ return (s||"").trim().toLowerCase(); }
function esc(s){ return (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }

function orderHtml(o){
  let h = `<div class="order-h">直播日期 ${esc(o.date||"-")}　<span class="disc">折扣 ${esc(o.discount||"-")}</span></div>`;
  if(o.method) h += `<div class="order-line"><b>回传方式</b>${esc(o.method)}</div>`;
  if(o.note)   h += `<div class="order-line"><b>备注</b>${esc(o.note)}</div>`;
  if(o.attachment) h += `<a class="order-link" href="${esc(o.attachment)}" target="_blank" rel="noopener">查看配货单</a>`;
  if(o.photo) h += `<img class="order-photo" src="${esc(o.photo)}" alt="开单照片" />`;
  return `<div class="order">${h}</div>`;
}

function search(){
  const raw = document.getElementById("q").value;
  const key = normalize(raw);
  const box = document.getElementById("result");
  if(!key){ box.classList.add("hidden"); return; }

  const hit = DATA.streamers.find(s =>
    normalize(s.code)===key || (s.wechat && normalize(s.wechat)===key) ||
    (s.phone && normalize(s.phone)===key)
  );

  if(hit){
    let html = `
      <div class="save-banner">这是您的专属一码通 · 长按下方图片保存到相册</div>
      <img src="${MERGED_QR_DATA[hit.code]}" alt="专属码" style="width:100%;max-width:360px;border-radius:16px;display:block;margin:14px auto 0;" />
      <div class="info-card">
        <div class="info-row"><span>主播码</span><b>${esc(hit.code)}</b></div>
        <div class="info-row"><span>昵称</span><b>${esc(hit.name||"-")}</b></div>
        <div class="info-row"><span>平台</span><b>${esc(hit.platform||"-")}</b></div>
        <div class="info-row"><span>手机号</span><b>${esc(hit.phone||"-")}</b></div>
      </div>`;

    html += `<div class="sec-title">关联进货单（${hit.orders.length}）</div>`;
    if(hit.orders.length){
      html += hit.orders.map(orderHtml).join("");
    } else {
      html += `<div class="empty">暂无关联进货单<br/>档口老板娘回传后将自动显示在这里</div>`;
    }
    box.innerHTML = html;

    // 二维码已预生成图片 cards/qr-${hit.code}.png(无需 JS 库)
  } else {
    box.innerHTML = `
      <div class="notfound">
        未找到「${esc(raw)}」对应的主播码。<br/><br/>
