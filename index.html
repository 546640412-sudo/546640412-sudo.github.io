    var r = await fetch("https://api.yyfafa.com/api/streamers?_=" + Date.now() + "&force=1", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    var data = await r.json();
    if (!data || !data.ok || !data.streamers) throw new Error("返回数据异常");
    var byCode = {};
    DATA.streamers.forEach(function(s){ byCode[s.code] = s; });
    data.streamers.forEach(function(s){
      var ex = byCode[s.code];
      if (ex) {
        // 实时字段优先；保留静态卡片图，实时有订单则覆盖
        ex.name = s.name || ex.name;
        ex.wechat = s.wechat || ex.wechat;
        ex.phone = s.phone || ex.phone;
        ex.platform = s.platform || ex.platform;
        ex.status = s.status || ex.status;
        ex.card = s.card || ex.card;
        if (s.orders && s.orders.length) ex.orders = s.orders;
      } else {
        DATA.streamers.push(s);
        byCode[s.code] = s;
      }
    });
    hide("status"); // 同步成功不显示"同步 N 人"文字（主播不需要知道）
  } catch(e){
    console.warn("live load fail", e);
    show("status");
    st.innerHTML = "网络异常，请稍后重试 · <a href=\"#\" onclick=\"loadLive(true);return false;\">重试</a>";
  }
}

function show(id){ var el=document.getElementById(id); if(el) el.classList.remove("hidden"); }
function hide(id){ var el=document.getElementById(id); if(el) el.classList.add("hidden"); }
function normalize(s){ return String(s||"").trim().toLowerCase().replace(/[\s\-]/g, ""); }
function esc(s){ return String(s||"").replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

function fileUrl(u){
  if(!u) return "";
  if(u.indexOf("kv:") === 0) return "https://api.yyfafa.com/api/file?k=" + encodeURIComponent(u.slice(3));
  if(u.indexOf("fs:") === 0) return ""; // 历史飞书图片（需令牌），门户不渲染，原图在飞书看板
  return "https://api.yyfafa.com/api/file?u=" + encodeURIComponent(u);
}
function orderHtml(o){
  var h = '<div class="order-h">直播日期 ' + esc(o.date||"-") + '　<span class="disc">折扣 ' + esc(o.discount||"-") + '</span></div>';
  if(o.method) h += '<div class="order-line"><b>回传方式</b>' + esc(o.method) + '</div>';
  if(o.country) h += '<div class="order-line"><b>直播国家</b>' + esc(o.country) + '</div>';
  if(o.note)   h += '<div class="order-line"><b>备注</b>' + esc(o.note) + '</div>';
  if(o.attachment) h += '<a class="order-link" href="' + esc(fileUrl(o.attachment)) + '" target="_blank" rel="noopener">查看配货单</a>';
  if(o.photo) h += '<img class="order-photo" src="' + esc(fileUrl(o.photo)) + '" alt="开单照片" />';
  if(o.tk) h += '<img class="order-photo" src="' + esc(fileUrl(o.tk)) + '" alt="TK数据大屏" />';
  if(o.online) h += '<img class="order-photo" src="' + esc(fileUrl(o.online)) + '" alt="在线场关" />';
  if(o.scene) h += '<img class="order-photo" src="' + esc(fileUrl(o.scene)) + '" alt="现场照" />';
  return '<div class="order">' + h + '</div>';
}

function makeQRCanvas(text, size){
  // qrcodejs 1.0.0 会内部新建 canvas 并 appendChild 到传入元素，故必须传容器 div，不能直接传 canvas
  var holder = document.createElement("div");
  holder.style.cssText = "position:absolute;left:-9999px;top:0;width:" + size + "px;height:" + size + "px;";
  document.body.appendChild(holder);
  try {
    new QRCode(holder, { text: text, width: size, height: size, colorDark: "#2E204E", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
  } catch(e){}
  var qc = holder.querySelector("canvas");
  var result;
  if (qc) {
    result = qc;
  } else {
    var qimg = holder.querySelector("img");
    result = document.createElement("canvas");
    result.width = size; result.height = size;
    var cx = result.getContext("2d");
    cx.fillStyle = "#fff"; cx.fillRect(0,0,size,size);
    if (qimg) { try { cx.drawImage(qimg, 0, 0, size, size); } catch(e){} }
  }
  document.body.removeChild(holder);
  return result;
}
// 合并一张卡：主播码 + 商家码 + 文字，主播可长按一次保存
function buildCombinedCard(streamerCode, merchantCode, name){
  var W = 480, H = 640;
  var c = document.createElement("canvas");
  c.width = W; c.height = H;
  var ctx = c.getContext("2d");
  var F = "'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.textAlign = "center";
  ctx.fillStyle = "#F7F5FD"; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = "#7C4DFF"; ctx.fillRect(0,0,W,96);
  ctx.fillStyle = "#fff"; ctx.font = "bold 30px " + F; ctx.fillText("ZB跨境直播", W/2, 38);
  ctx.fillStyle = "#E2D8FF"; ctx.font = "15px " + F; ctx.fillText("主播专属码 · 一码对接", W/2, 74);
  ctx.fillStyle = "#2E204E"; ctx.font = "bold 28px " + F; ctx.fillText(name || "", W/2, 138);
  var qs = makeQRCanvas(RETURN_URL + streamerCode, 180);
  var qm = makeQRCanvas(DK_URL + merchantCode, 180);
  ctx.fillStyle = "#fff";
  ctx.fillRect(30, 172, 202, 320);
  ctx.fillRect(248, 172, 202, 320);
  ctx.drawImage(qs, 41, 188, 180, 180);
  ctx.drawImage(qm, 259, 188, 180, 180);
  ctx.fillStyle = "#E040FB"; ctx.font = "bold 15px " + F; ctx.fillText("② 主播专属码", 131, 406);
  ctx.fillStyle = "#9684C4"; ctx.font = "12px " + F; ctx.fillText("主播扫 · 回传", 131, 426);
  ctx.fillStyle = "#7C4DFF"; ctx.font = "bold 17px " + F; ctx.fillText(streamerCode, 131, 454);
  ctx.fillStyle = "#5E35B1"; ctx.font = "bold 15px " + F; ctx.fillText("③ 商家回传码", 349, 406);
  ctx.fillStyle = "#9684C4"; ctx.font = "12px " + F; ctx.fillText("商家扫 · 自动绑定", 349, 426);
  ctx.fillStyle = "#7C4DFF"; ctx.font = "bold 17px " + F; ctx.fillText(merchantCode, 349, 454);
  ctx.fillStyle = "#9684C4"; ctx.font = "13px " + F; ctx.fillText("一码一人 · 长期有效 · 长按保存", W/2, 612);
  return c.toDataURL("image/png");
}

async function search(){
  await loadLive(); // 每次检索前实时刷新，保证新入驻主播立即可查
  var raw = document.getElementById("q").value;
  var key = normalize(raw);
  var box = document.getElementById("result");
  if(!key){ box.classList.add("hidden"); return; }

  var hit = DATA.streamers.find(function(s){
    return normalize(s.code)===key || normalize(s.name)===key || (s.wechat && normalize(s.wechat)===key) || (s.phone && normalize(s.phone)===key);
  });

  if(hit){
    var mcode = hit.merchant_code || "";
    var html = '<div class="save-banner">这是您的专属一码通 · 长按下方卡片保存 / 点按钮回传</div>';
    html += '<img id="combinedCard" class="card-img" alt="专属一码通卡(含主播码+商家码)" style="width:100%;max-width:420px;margin:14px auto 0;display:block;" />';
    html += '<div class="btn-links">' +
      '<a class="btn-return" href="' + RETURN_URL + esc(hit.code) + '" target="_blank" rel="noopener">主播回传</a>' +
      '<a class="btn-dk" href="' + DK_URL + esc(mcode || hit.code) + '" target="_blank" rel="noopener">商家回传</a>' +
      '</div>';
    html += '<div class="info-card">' +
      '<div class="info-row"><span>主播码</span><b>' + esc(hit.code) + '</b></div>' +
      '<div class="info-row"><span>昵称</span><b>' + esc(hit.name||"-") + '</b></div>' +
      '<div class="info-row"><span>平台</span><b>' + esc(hit.platform||"-") + '</b></div>' +
      '<div class="info-row"><span>手机号</span><b>' + esc(hit.phone||"-") + '</b></div>' +
      '</div>';
    html += '<div class="sec-title">关联进货单（' + (hit.orders?hit.orders.length:0) + '）</div>';
    if(hit.orders && hit.orders.length){
      html += hit.orders.map(orderHtml).join("");
    } else {
      html += '<div class="empty">暂无关联进货单<br/>档口商家回传后将自动显示在这里</div>';
    }
    box.innerHTML = html;
    // 动态生成一张合并卡（主播码 + 商家码 + 文字），主播长按即可一次保存
    setTimeout(function(){
      var img = document.getElementById("combinedCard");
      if (img) img.src = buildCombinedCard(hit.code, mcode || hit.code, hit.name || "");
    }, 0);
  } else {
    box.innerHTML = '<div class="notfound">' +
      '未找到「' + esc(raw) + '」对应的主播码。<br/><br/>' +
      '若您是<b>首次对接的新主播</b>，请先登记入驻领取专属码：<br/>' +
      '<a class="enroll-inline" href="https://pan.yyfafa.com/enroll.html?v=8" target="_blank" rel="noopener">＋ 去登记入驻</a>' +
      '<br/><br/><span style="font-size:12.5px;color:#9684C4;">若您已入驻仍查不到，请确认输入的主播码 / 微信号 / 手机号是否正确，或联系对接人。</span>' +
      '</div>';
  }
  box.classList.remove("hidden");
}

document.getElementById("go").addEventListener("click", search);
document.getElementById("q").addEventListener("keydown", function(e){ if(e.key==="Enter") search(); });

// URL ?code= 或 ?q= 直接查询(支持入驻后跳转带手机号自动搜索)
(function(){
  var p = new URLSearchParams(location.search);
  var q = p.get("q") || p.get("code");
  if(q){ document.getElementById("q").value = q; search(); }
  else { loadLive(); }
})();
</script>
