<style>

    --bg:#F7F5FD; --ink:#2E204E; --sub:#9684C4; --line:#ECE7F7;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);min-height:100vh;}
  .topbar{background:var(--purple);color:#fff;text-align:center;padding:22px 16px 18px;}
  .topbar h1{margin:0;font-size:22px;letter-spacing:1px;}
  .topbar p{margin:6px 0 0;font-size:13px;color:var(--purple-l);}
  .wrap{max-width:460px;margin:0 auto;padding:20px 18px 40px;}
  .form .row{margin-bottom:14px;}
  .form label{display:block;font-size:13.5px;color:var(--sub);margin-bottom:6px;}
  .form input, .form select, .form textarea{
    width:100%;border:2px solid var(--line);border-radius:12px;padding:12px 14px;
    font-size:15px;outline:none;background:#fff;color:var(--ink);}
  .form input:focus, .form select:focus, .form textarea:focus{border-color:var(--purple);}
  .submit{width:100%;background:var(--purple);color:#fff;border:none;border-radius:12px;
    padding:15px;font-size:16px;font-weight:700;margin-top:6px;}
  .submit:disabled{opacity:.6;}
  .back{display:block;text-align:center;color:var(--sub);font-size:12.5px;margin-top:16px;text-decoration:none;}
  .hidden{display:none;}
  .result{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center;}
  .result h2{margin:0 0 4px;font-size:16px;color:var(--purple-d);}
  .code-show{font-size:34px;font-weight:800;color:var(--purple);letter-spacing:2px;margin:14px 0 8px;padding:14px;background:#F7F5FD;border-radius:12px;border:2px dashed var(--purple-l);}
  .tip{font-size:12.5px;color:var(--sub);line-height:1.7;margin-top:10px;}
  .tip strong{color:var(--purple-d);}
  .err{color:#d33;font-size:13px;margin-top:10px;}
</style>

      <div class="row"><label>直播平台</label>

          <option>快手</option><option>视频号</option><option>其他</option>
        </select>
      </div>
      <div class="row"><label>账号ID / 主页号</label><input name="accountId" placeholder="平台上的账号ID" /></div>
      <div class="row"><label>微信号</label><input name="wechat" placeholder="便于对接人联系" /></div>
      <div class="row"><label>手机号</label><input name="phone" inputmode="numeric" placeholder="便于查回专属码" /></div>
      <div class="row"><label>备注</label><textarea name="note" rows="2" placeholder="选填"></textarea></div>
      <button class="submit" type="submit" id="btn">提交并领取专属码</button>

<script>
// ★ 前端本地生成专属码：完全不依赖后端,提交即出码,零等待
document.getElementById("f").addEventListener("submit", function(e){
  e.preventDefault();
  var btn = document.getElementById("btn");
  var errBox = document.getElementById("err");
  errBox.classList.add("hidden");
  btn.disabled = true; btn.textContent = "提交中…";

  var fd = new FormData(e.target);
  var payload = {};
  fd.forEach(function(v, k){ payload[k] = (v || "").toString().trim(); });

  if (!payload.name) {
    errBox.textContent = "请填写昵称";
    errBox.classList.remove("hidden");
    btn.disabled = false; btn.textContent = "提交并领取专属码";
    return;
  }

  // 读取已存在的新主播列表(去重 + 复用码)
  var news = [];
  try { news = JSON.parse(localStorage.getItem("cg_new_streamers") || "[]"); } catch(e){}
  var exist = news.find(function(s){
    return (payload.phone && s.phone === payload.phone) ||
           (payload.wechat && s.wechat === payload.wechat) ||
           s.name === payload.name;
  });

  var code;
  if (exist) {
    code = exist.code;
    document.getElementById("rTitle").textContent = "您已入驻过，这是您已有的专属码";
  } else {
    // 基于 localStorage 计数器自增生成下一个码
    var ctr = parseInt(localStorage.getItem("cg_code_counter") || "10", 10);
    ctr += 1;
    code = "CG-PAN-" + String(ctr).padStart(3, "0");
    localStorage.setItem("cg_code_counter", String(ctr));
    // 保存新主播到 localStorage
    news.push(Object.assign({}, payload, {code: code, ts: Date.now()}));
    localStorage.setItem("cg_new_streamers", JSON.stringify(news));
  }

  document.getElementById("rCode").textContent = code;
  document.getElementById("f").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");
  btn.disabled = false; btn.textContent = "提交并领取专属码";
});
</script>
