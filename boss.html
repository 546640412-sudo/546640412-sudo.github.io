<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>ZB跨境直播 · 扫码回传</title>
<script>
// 微信/浏览器强缓存穿透：入口必须带 v=9 参数才认为是最新版本
(function(){
  try {
    var url = new URL(location.href);
    if (url.searchParams.get('v') !== '9') {
      url.searchParams.set('v', '9');
      location.replace(url.toString());
    }
  } catch(e) {}
})();
</script>
<style>
  :root{ --purple:#7C4DFF; --purple-d:#5E35B1; --purple-l:#E2D8FF; --bg:#F7F5FD; --ink:#2E204E; --sub:#9684C4; --line:#ECE7F7; --ok:#16a34a; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
  .topbar{background:var(--purple);color:#fff;text-align:center;padding:24px 16px 18px;}
  .topbar h1{margin:0;font-size:21px;letter-spacing:1px;}
  .topbar p{margin:6px 0 0;font-size:13px;color:var(--purple-l);}
  .wrap{max-width:460px;margin:0 auto;padding:20px 18px 40px;}
  .card{background:#fff;border-radius:16px;padding:20px;border:1px solid var(--line);margin-bottom:16px;}
  .code-line{text-align:center;font-size:13px;color:var(--sub);}
  .code-show{font-size:28px;font-weight:800;color:var(--purple);letter-spacing:2px;margin:6px 0 4px;padding:10px;background:#F7F5FD;border-radius:12px;border:2px dashed var(--purple-l);text-align:center;}
  .pick-tip{font-size:14px;text-align:center;margin:16px 0 12px;font-weight:600;}
  .btns{display:flex;flex-direction:column;gap:12px;}
  .btn{display:block;text-align:center;padding:16px;border-radius:14px;font-size:16px;font-weight:700;color:#fff;border:none;width:100%;}
  .btn-jd{background:var(--purple-d);}
  .btn-hc{background:var(--purple);}
  .btn small{display:block;font-size:12px;font-weight:400;opacity:.85;margin-top:4px;}
  .fld{margin-bottom:14px;}
  .fld label{display:block;font-size:13.5px;color:var(--sub);margin-bottom:6px;}
  .fld input,.fld select,.fld textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;outline:none;background:#fff;color:var(--ink);}
  .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--purple);}
  .ro{background:#F7F5FD!important;color:var(--purple-d)!important;font-weight:700;}
  .submit{width:100%;background:var(--purple);color:#fff;border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:700;margin-top:6px;}
  .submit:disabled{opacity:.6;}
  .back{display:block;text-align:center;color:var(--sub);font-size:12.5px;margin-top:14px;text-decoration:none;}
  .modal-overlay{display:none;}
  .modal-overlay:not(.hidden){display:block;}
  .modal-content{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 20px;text-align:center;box-shadow:0 8px 24px rgba(94,53,177,.12);margin-top:16px;}
  .modal-content .tick{font-size:52px;color:var(--ok);}
  .modal-content h2{margin:10px 0 6px;font-size:18px;color:var(--ink);}
  .modal-content p{font-size:13.5px;color:var(--sub);line-height:1.7;}
  .err{color:#d33;font-size:13px;margin-top:10px;text-align:center;}
  .hidden{display:none;}
</style>
</head>
<body>
  <div class="topbar"><h1>ZB跨境直播</h1><p>扫码回传 · 主播码已自动带好</p></div>
  <div class="wrap">

    <!-- 主播码 -->
    <div class="card" style="padding:14px;">
      <div class="code-line" id="codeLabel">本次主播码</div>
      <div class="code-show" id="codeShow">ZB-PAN-000</div>
    </div>

    <!-- 商家回传：扫码带出主播，商家用手机号识别身份并绑定该主播 -->
    <div id="merchantBox" class="card hidden" style="border-color:var(--purple);">
      <div class="pick-tip">本次主播已关联的商家</div>
      <div id="merchantBound" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;"></div>
      <p style="font-size:12px;color:var(--sub);text-align:center;margin:10px 0 0;line-height:1.6;">同一手机号商家扫多个主播卡，会自动逐个绑定主播，无需重复建档。</p>
    </div>

    <!-- 商家回传（含本次类型，自动区分建档/日常回传） -->
    <div id="bossForm" class="card hidden">
      <div class="pick-tip">档口回传</div>
      <div class="fld"><label>手机号（识别身份 · 首次自动建档）</label><input id="mer_phone" inputmode="numeric" placeholder="*请输入手机号*"></div>
      <div class="fld"><label>本次类型</label>
        <select id="boss_type">
          <option value="">请选择</option>
          <option value="首次建档">首次建档（第一次合作 · 填档口资料）</option>
          <option value="日常回传">日常回传（已建档 · 传开单/表格）</option>
        </select>
      </div>

      <!-- 直播货盘表：上传 Excel 文件即可，内容都在表里，无需手填 -->
      <div class="fld"><label>上传直播货盘表（Excel · 选传）</label>
        <input id="huopan_file" type="file" accept=".xlsx,.xls,.csv">
        <div id="huopanFileName" style="font-size:12px;color:var(--sub);margin-top:6px;"></div>
      </div>

      <!-- 建档字段 -->
      <div id="jdFields" class="hidden">
        <div class="fld"><label>商铺名称</label><input id="jd_name" placeholder="*商铺名称*"></div>
        <div class="fld"><label>地址+档口号</label><input id="jd_addr" placeholder="*地址+档口号*"></div>
        <div class="fld"><label>主营类目</label><input id="jd_cat" placeholder="*主营类目*"></div>
      </div>

      <!-- 日常回传字段 -->
      <div id="hcFields" class="hidden">
        <div class="fld"><label>直播日期</label><input id="hc_date" type="date"></div>
        <div class="fld"><label>折扣比例</label><input id="hc_discount" placeholder="*折扣比例*"></div>
        <div class="fld"><label>回传方式</label>
          <select id="hc_method"><option value="">请选择</option><option value="导入">导入（上传开单表格/图片）</option><option value="拍照">拍照（现场开单照）</option></select>
        </div>
        <div class="fld hidden" id="hcFileWrap"><label id="hcFileLabel">开单照片</label>
          <input id="hc_file" type="file" accept="image/*">
          <div id="hcFileName" style="font-size:12px;color:var(--sub);margin-top:6px;"></div>
        </div>
        <div class="fld"><label>备注</label><textarea id="hc_note" rows="2" placeholder="*备注*"></textarea></div>
      </div>

      <button class="submit" id="bossSubmit">提交</button>
    </div>

    <!-- 主播回传表单 -->
    <div id="streamerForm" class="card hidden">
      <div class="pick-tip">主播回传</div>
      <div class="fld"><label>直播平台</label>
        <select id="st_platform"><option value="">请选择</option><option>TikTok</option><option>其他</option></select>
      </div>
      <div class="fld hidden" id="st_otherWrap"><label>其他平台名称</label><input id="st_other" placeholder="如：小红书 / 抖音"></div>
      <div class="fld"><label>直播国家</label><input id="st_country" placeholder="如：美国 / 英国 / 马来西亚"></div>
      <div class="fld"><label>直播日期</label><input id="st_date" type="date"></div>
      <div class="fld hidden" id="st_tkWrap"><label>TK数据大屏（截图）</label><input id="st_tk" type="file" accept="image/*"><div id="st_tk_name" style="font-size:12px;color:var(--sub);margin-top:6px;"></div></div>
      <div class="fld hidden" id="st_onlineWrap"><label>在线场关（截图）</label><input id="st_online" type="file" accept="image/*"><div id="st_online_name" style="font-size:12px;color:var(--sub);margin-top:6px;"></div></div>
      <div class="fld"><label>现场照</label><input id="st_scene" type="file" accept="image/*" capture="camera"><div id="st_scene_name" style="font-size:12px;color:var(--sub);margin-top:6px;"></div></div>
      <div class="fld"><label>备注</label><textarea id="st_note" rows="2" placeholder="选填"></textarea></div>
      <button class="submit" id="stSubmit">提交回传</button>
    </div>

    <!-- 成功 -->
    <div id="okOverlay" class="modal-overlay hidden">
      <div id="okBox" class="modal-content">
        <div class="tick">✓</div>
        <h2>已提交</h2>
        <p id="okMsg">数据已进入后台，可返回或关闭本页</p>
        <a class="back" href="javascript:location.href=location.href.split('?')[0]+'?v=9'">继续回传另一单</a>
      </div>
    </div>

    <div id="errBox" class="err hidden"></div>
    <a class="back" href="https://pan.yyfafa.com/?v=9">← 返回主播专属主页</a>
  </div>

<script>
var API = "https://api.yyfafa.com/api/submit";
var API_MERCHANT = "https://api.yyfafa.com/api/merchant";
var p = new URLSearchParams(location.search);
var CODE = (p.get("code") || "").trim();
var ROLE = (p.get("role") || "").trim();
// 主播码 / 商家回传码都用主播码 ZB-PAN，靠 role 参数区分：streamer=主播回传，merchant=商家回传

document.getElementById("codeShow").textContent = CODE || "未识别";

// 商家回传：扫码带来的 code = 主播码（商家扫主播卡上的"商家回传"码，绑定这个主播；商家身份用手机号识别）
if (ROLE === "merchant" && CODE) {
  var cl = document.getElementById("codeLabel");
  if (cl) cl.textContent = "本次主播码（商家回传 · 自动绑定该主播）";
  fetch("https://api.yyfafa.com/api/streamer?code=" + encodeURIComponent(CODE) + "&_=" + Date.now(), { cache: "no-store" })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d && d.ok && d.streamer) {
        var nm = d.streamer.name;
        if (nm) document.getElementById("codeShow").textContent = CODE + " · " + nm;
        // 已绑定过这个主播的商家（1:N，手机号识别）
        if (d.merchants && d.merchants.length) {
          show("merchantBox");
          var box = document.getElementById("merchantBound");
          box.innerHTML = "";
          d.merchants.forEach(function(m){
            var chip = document.createElement("span");
            chip.textContent = m.name + " · " + m.phone;
            chip.style.cssText = "background:#F7F5FD;color:var(--purple-d);border:1px solid var(--purple-l);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600;";
            box.appendChild(chip);
          });
        }
      } else {
        var eb = document.getElementById("errBox");
        if (eb) { eb.textContent = "⚠️ 该主播码未登记，请确认扫码来源。"; eb.classList.remove("hidden"); }
      }
    })
    .catch(function(){ /* 预填失败不阻塞，仍可手动回传 */ });
}

// 主播码：扫码自动校验并预填本人信息（自动预填能力；数据源纯 KV，不依赖飞书授权）
if (ROLE === "streamer" && CODE) {
  var sl = document.getElementById("codeLabel");
  if (sl) sl.textContent = "本次主播码（已自动带出）";
  fetch("https://api.yyfafa.com/api/streamer?code=" + encodeURIComponent(CODE) + "&_=" + Date.now(), { cache: "no-store" })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d && d.ok && d.streamer) {
        var nm = d.streamer.name;
        if (nm) document.getElementById("codeShow").textContent = CODE + " · " + nm;
        if (d.merchants && d.merchants.length) {
          var mb = document.getElementById("merchantBound");
          if (mb) {
            show("merchantBox");
            mb.innerHTML = "";
            d.merchants.forEach(function(m){
              var chip = document.createElement("span");
              chip.textContent = m.name + " · " + m.phone;
              chip.style.cssText = "background:#F7F5FD;color:var(--purple-d);border:1px solid var(--purple-l);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600;";
              mb.appendChild(chip);
            });
          }
        }
      } else {
        var eb = document.getElementById("errBox");
        if (eb) { eb.textContent = "⚠️ 该主播码未在系统中登记，请确认扫码来源或先完成入驻。"; eb.classList.remove("hidden"); }
      }
    })
    .catch(function(){ /* 校验失败不阻塞，仍可手动回传 */ });
}

function show(id){ document.getElementById(id).classList.remove("hidden"); }
function hide(id){ document.getElementById(id).classList.add("hidden"); }
function err(msg){ var e=document.getElementById("errBox"); e.textContent=msg; e.classList.remove("hidden"); }
function clearErr(){ document.getElementById("errBox").classList.add("hidden"); }

var submitting = false; // 防重复提交锁
function doSubmit(formType, fields){
  if(submitting) return; // 已在提交中，忽略重复点击
  clearErr();
  submitting = true;
  var btn = document.activeElement;
  if(btn) btn.disabled = true;
  fetch(API, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ form_type: formType, fields: fields })
  }).then(function(r){ return r.json(); }).then(function(d){
    submitting = false;
    if(btn) btn.disabled = false;
    if(d && d.ok){
      show("okOverlay");
      document.getElementById("okMsg").textContent = "提交成功，数据已进入后台（" + CODE + "）";
    } else if(d && d.need_setup){
      err("提交失败：飞书应用暂无编辑权限。请让管理员在飞书多维表格「权限设置」里，把应用「cli_aa01027d7e789bd5」加为「可编辑」协作者（一次性设置，之后永久免授权）。");
    } else {
      err("提交失败：" + ((d && d.msg) || "网络异常，请稍后重试"));
    }
  }).catch(function(){
    submitting = false;
    if(btn) btn.disabled = false;
    err("网络异常，提交未成功，请稍后重试");
  });
}

function dateTs(v){
  if(!v) return undefined;
  var d = new Date(v + "T00:00:00+08:00");
  return d.getTime();
}

function readFileAsDataUrl(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){ resolve(reader.result); };
    reader.onerror = function(){ reject(reader.error || new Error("读取失败")); };
    reader.readAsDataURL(file);
  });
}

if(ROLE === "streamer"){
  show("streamerForm");
  document.getElementById("st_platform").addEventListener("change", function(){
    var v = this.value;
    if(v === "其他"){ show("st_otherWrap"); show("st_onlineWrap"); hide("st_tkWrap"); }
    else if(v === "TikTok"){ hide("st_otherWrap"); show("st_tkWrap"); hide("st_onlineWrap"); }
    else { hide("st_otherWrap"); hide("st_tkWrap"); hide("st_onlineWrap"); }
  });
  // 显示已选附件文件名
  ["st_tk","st_online","st_scene"].forEach(function(id){
    document.getElementById(id).addEventListener("change", function(){
      var f = this.files && this.files[0];
      document.getElementById(id + "_name").textContent = f ? ("已选：" + f.name) : "";
    });
  });
  document.getElementById("stSubmit").addEventListener("click", async function(){
    var plat = document.getElementById("st_platform").value;
    if(!plat){ err("请选择直播平台"); return; }
    var fields = { "主播码": CODE, "直播平台": plat };
    if(plat === "其他") fields["其他平台名称"] = document.getElementById("st_other").value.trim();
    var country = document.getElementById("st_country").value.trim();
    if(country) fields["直播国家"] = country;
    var d = dateTs(document.getElementById("st_date").value);
    if(d) fields["直播日期"] = d;
    var n = document.getElementById("st_note").value.trim();
    if(n) fields["备注"] = n;
    // 平台区分：TikTok 传 TK数据大屏；其他平台 传 在线场关；现场照始终可传
    var atts = [{ id: "st_scene", field: "现场照" }];
    if(plat === "TikTok") atts.push({ id: "st_tk", field: "TK数据大屏" });
    if(plat === "其他") atts.push({ id: "st_online", field: "在线场关" });
    for(var i=0;i<atts.length;i++){
      var a = atts[i];
      var file = document.getElementById(a.id).files && document.getElementById(a.id).files[0];
      if(file){
        try{ fields[a.field] = await readFileAsDataUrl(file); }
        catch(e){ err("文件读取失败：" + (e.message || e)); return; }
      }
    }
    doSubmit("streamer_hc", fields);
  });
} else {
  show("bossForm");
  document.getElementById("boss_type").addEventListener("change", function(){
    var v = this.value;
    if(v === "首次建档"){ show("jdFields"); hide("hcFields"); }
    else if(v === "日常回传"){ show("hcFields"); hide("jdFields"); }
    else { hide("jdFields"); hide("hcFields"); }
  });
  // 回传方式切换：显隐真实上传入口（导入/拍照）
  var hcFileWrap = document.getElementById("hcFileWrap");
  var hcFileInput = document.getElementById("hc_file");
  var hcFileLabel = document.getElementById("hcFileLabel");
  document.getElementById("hc_method").addEventListener("change", function(){
    var v = this.value;
    if(v === "导入"){
      show("hcFileWrap");
      hcFileLabel.textContent = "导入表格/图片";
      hcFileInput.setAttribute("accept", ".xlsx,.xls,.csv,.pdf,image/*");
      hcFileInput.removeAttribute("capture");
    } else if(v === "拍照"){
      show("hcFileWrap");
      hcFileLabel.textContent = "现场拍照（开单照）";
      hcFileInput.setAttribute("accept", "image/*");
      hcFileInput.setAttribute("capture", "camera");
    } else {
      hide("hcFileWrap");
    }
  });
  hcFileInput.addEventListener("change", function(){
    var f = this.files && this.files[0];
    document.getElementById("hcFileName").textContent = f ? ("已选：" + f.name) : "";
  });
  var huopanInput = document.getElementById("huopan_file");
  huopanInput.addEventListener("change", function(){
    var f = this.files && this.files[0];
    document.getElementById("huopanFileName").textContent = f ? ("已选：" + f.name) : "";
  });
  document.getElementById("bossSubmit").addEventListener("click", async function(){
    var phone = document.getElementById("mer_phone").value.trim();
    if(!phone){ err("请输入手机号（用于识别身份）"); return; }
    var t = document.getElementById("boss_type").value;
    if(!t){ err("请选择本次类型"); return; }
    var fields = { "主播码": CODE, "商家手机号": phone, "本次类型": t };
    // 直播货盘表：上传 Excel 文件（内容都在表里，无需手填）
    var huopanFile = document.getElementById("huopan_file").files && document.getElementById("huopan_file").files[0];
    if(huopanFile){
      try{ fields["货盘表"] = await readFileAsDataUrl(huopanFile); }
      catch(e){ err("货盘表读取失败：" + (e.message || e)); return; }
    }
    if(t === "首次建档"){
      var name = document.getElementById("jd_name").value.trim();
      if(!name){ err("请填写商铺名称"); return; }
      fields["商铺名称"] = name;
      var a = document.getElementById("jd_addr").value.trim(); if(a) fields["地址档口号"] = a;
      var c = document.getElementById("jd_cat").value.trim(); if(c) fields["主营类目"] = c;
      doSubmit("boss_jd", fields);
    } else {
      var m = document.getElementById("hc_method").value;
      if(!m){ err("请选择回传方式"); return; }
      fields["回传方式"] = m;
      var d = dateTs(document.getElementById("hc_date").value);
      if(d) fields["直播日期"] = d;
      var dis = document.getElementById("hc_discount").value.trim(); if(dis) fields["折扣比例"] = dis;
      var n = document.getElementById("hc_note").value.trim(); if(n) fields["备注"] = n;
      var file = hcFileInput.files && hcFileInput.files[0];
      if(file){
        var fieldName = (m === "导入") ? "表格导入" : "开单照片";
        try{
          fields[fieldName] = await readFileAsDataUrl(file);
        }catch(e){
          err("文件读取失败：" + (e.message || e)); return;
        }
      }
      doSubmit("boss_hc", fields);
    }
  });
}
</script>
</body>
</html>
