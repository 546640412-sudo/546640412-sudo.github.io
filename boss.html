<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>CG跨境直播</title>
<style>
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#F7F5FD;color:#2E204E;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;}
  .spinner{width:36px;height:36px;border:4px solid #E2D8FF;border-top-color:#7C4DFF;border-radius:50%;margin:0 auto 16px;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .tip{font-size:14px;color:#9684C4;}
</style>
</head>
<body>
<div>
  <div class="spinner"></div>
  <div class="tip" id="tip">正在跳转企微表格…</div>
</div>
<script>
// ★ 中转页:识别主播码(role)后立即跳转对应企微表格,表格字段已设计好,直接让她们填
var P = new URLSearchParams(location.search);
var ROLE = P.get("role") || "boss";
var RETURN_URL = "https://doc.weixin.qq.com/smartsheet/form/1_wpuhKyBwAAcmbbqssZ_-93rtRz4i-HJw_707e78";  // 主播回传表
var DK_URL    = "https://doc.weixin.qq.com/smartsheet/form/1_wpuhKyBwAAcmbbqssZ_-93rtRz4i-HJw_5eebb9";  // 档口回传表
var url = (ROLE === "streamer") ? RETURN_URL : DK_URL;
setTimeout(function(){ window.location.replace(url); }, 400);
</script>
</body>
</html>
