<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>CG跨境直播 · 档口扫码</title>
<style>
  :root{ --purple:#7C4DFF; --purple-d:#5E35B1; --purple-l:#E2D8FF; --bg:#F7F5FD; --ink:#2E204E; --sub:#9684C4; --line:#ECE7F7; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
  .topbar{background:var(--purple);color:#fff;text-align:center;padding:26px 16px 20px;}
  .topbar h1{margin:0;font-size:22px;letter-spacing:1px;}
  .topbar p{margin:6px 0 0;font-size:13px;color:var(--purple-l);}
  .wrap{max-width:460px;margin:0 auto;padding:24px 18px 40px;}
  .card{background:#fff;border-radius:16px;padding:24px 20px;border:1px solid var(--line);}
  .code-line{text-align:center;margin-bottom:6px;}
  .code-line span{font-size:13px;color:var(--sub);}
  .code-show{font-size:30px;font-weight:800;color:var(--purple);letter-spacing:2px;margin:8px 0 4px;padding:12px;background:#F7F5FD;border-radius:12px;border:2px dashed var(--purple-l);text-align:center;}
  .pick-tip{font-size:14px;color:var(--ink);text-align:center;margin:20px 0 14px;font-weight:600;}
  .btns{display:flex;flex-direction:column;gap:14px;}
  .btn{display:block;text-align:center;padding:18px;border-radius:14px;font-size:16px;font-weight:700;text-decoration:none;color:#fff;}
  .btn-jd{background:var(--purple-d);}
  .btn-hc{background:var(--purple);}
  .btn small{display:block;font-size:12px;font-weight:400;opacity:.85;margin-top:4px;}
  .foot{text-align:center;color:var(--sub);font-size:12px;margin-top:26px;}
</style>
</head>
<body>
  <div class="topbar"><h1>CG跨境直播</h1><p>档口扫码 · 一码对接</p></div>
  <div class="wrap" id="wrap">
    <div id="bossPanel" class="hidden">
      <div class="card">
        <div class="code-line"><span>当前主播码</span></div>
        <div class="code-show" id="codeShow">CG-PAN-000</div>
        <div class="pick-tip">请选择本次操作</div>
        <div class="btns">
          <a class="btn btn-jd" id="btnJd" href="#" target="_blank" rel="noopener">首次建档<small>第一次跟这位主播合作 · 填档口资料</small></a>
          <a class="btn btn-hc" id="btnHc" href="#" target="_blank" rel="noopener">日常回传<small>已建档 · 传开单照片或表格</small></a>
        </div>
      </div>
      <p class="foot">两个都带好主播码，选错也不要紧，返回重选即可</p>
    </div>
    <div id="streamerPanel" class="hidden">
      <div class="card" style="text-align:center;">
        <p style="font-size:15px;color:var(--ink);margin:10px 0;">正在进入主播回传表单…</p>
        <p style="font-size:13px;color:var(--sub);">主播码已自动带好，稍候跳转</p>
      </div>
    </div>
  </div>

<script>
var JD_FORM = "https://ckzusnk8h4.feishu.cn/share/base/shrcnm51kclmSLaAWoSBc8t8NKT";
var HC_FORM = "https://ckzusnk8h4.feishu.cn/share/base/shrcn5JusWXOCJtSAyyd1PNm9Td";
var RETURN_FORM = "https://ckzusnk8h4.feishu.cn/share/base/shrcn5aOyKvtNAJdAPGGhPnZMKb";
var FIELD = encodeURIComponent("主播码");

var p = new URLSearchParams(location.search);
var code = (p.get("code") || "").trim();
var role = (p.get("role") || "").trim();
var prefill = "?prefill_" + FIELD + "=" + encodeURIComponent(code);

if(role === "streamer"){
  // 主播扫：直接跳主播回传表单（带预填码）
  document.getElementById("streamerPanel").classList.remove("hidden");
  setTimeout(function(){ window.location.replace(RETURN_FORM + prefill); }, 500);
} else {
  // 商家扫：二选一
  document.getElementById("codeShow").textContent = code || "未识别";
  document.getElementById("btnJd").href = JD_FORM + prefill;
  document.getElementById("btnHc").href = HC_FORM + prefill;
  document.getElementById("bossPanel").classList.remove("hidden");
}
</script>
</body>
</html>
